const MathCheck=(()=>{
const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b)[a,b]=[b,a%b];return a||1n;};
const Q=(n,d=1n)=>{n=BigInt(n);d=BigInt(d);if(!d)throw Error('Ein Nenner darf nicht 0 sein.');if(d<0n){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};};

function absolute(p){const c=constant(p);if(c)return c.n? [term(Q(c.n<0n?-c.n:c.n,c.d))]:[];if(p.some(t=>t.r!==1||t.x>1||t.a))throw Error('Für diese Aufgaben genügt ein Betrag eines linearen Terms in x.');const a=p.find(t=>t.x===1)?.c;if(!a)throw Error('Prüfe den Betragterm.');const b=p.find(t=>t.x===0)?.c||Q(0);return [term(Q(a.n<0n?-a.n:a.n,a.d),1,0,qs(div(b,a)))];}
function parse(raw){let s=String(raw).toLowerCase().trim().replace(/\s+/g,'').replaceAll('−','-').replace(/[·×]/g,'*').replaceAll('²','^2').replaceAll('³','^3').replaceAll(',','.').replaceAll('wurzel','sqrt').replaceAll('√','sqrt');if(s.length>150)throw Error('Der Term ist zu lang.');let open=false;s=s.replace(/\|/g,()=>{open=!open;return open?'abs(':')';});if(open)throw Error('Schließe den Betrag mit einem zweiten |.');
const tokens=[];let i=0;while(i<s.length){const r=s.slice(i);const m=r.match(/^(sqrt|abs|x|\d+(?:\.\d+)?|[+\-*/^()])/);if(!m)throw Error('Verwende Zahlen, x, +, −, *, /, Klammern, sqrt(...) oder |...|.');tokens.push(m[0]);i+=m[0].length;}if(!tokens.length)throw Error('Trage zuerst deinen Ergebnisterm ein.');let p=0;
function atom(){const t=tokens[p++];if(t==='('){const a=expr();if(tokens[p++]!==')')throw Error('Eine schließende Klammer fehlt.');return a;}if(t==='sqrt'||t==='abs'){let a;if(tokens[p]==='('){p++;a=expr();if(tokens[p++]!==')')throw Error('Schließe die Klammer der Wurzel oder des Betrags.');}else if(t==='sqrt'){a=unary();}else throw Error('Schreibe abs(...) oder |...|.');return {op:t,a};}if(t==='x')return{op:'x'};if(t&&/^\d/.test(t))return{op:'n',v:t};throw Error('Der Term ist noch unvollständig.');}

const rootDenom=t=>(t.op==='/'&&has(t.b,'sqrt'))||!!(t.a&&rootDenom(t.a))||!!(t.b&&rootDenom(t.b));

const lcm=(a,b)=>a/gcd(a,b)*b;
// Keep a common denominator without cancelling it against the numerator.
// Numerators are simplified exactly, including square factors inside radicals.
function fractionForm(t){
 function lift(p){const d=p.reduce((n,v)=>lcm(n,v.c.d),1n);return{p:scale(p,Q(d)),d};}
 if(t.op==='neg'){const a=fractionForm(t.a);return{p:scale(a.p,Q(-1)),d:a.d};}

 if(t.op==='*'){const a=fractionForm(t.a),b=fractionForm(t.b);return{p:product(a.p,b.p),d:a.d*b.d};}

 }
 return lift(calc(t));
}
function remainingFactor(ast){const f=fractionForm(ast);return f.p.reduce((g,t)=>gcd(g,t.c.n),f.d);}
function check(raw,task){try{const ast=parse(raw);if(task.mode==='rationalize'&&rootDenom(ast))return{ok:false,msg:'Der Nenner enthält noch ein Wurzelzeichen. Erweitere passend und rechne den Nenner aus.'};if(task.mode==='root'&&has(ast,'sqrt'))return{ok:false,msg:'Schreibe das Ergebnis ohne Wurzelzeichen. Suche die passende binomische Formel.'};if(task.noAbs&&has(ast,'abs'))return{ok:false,msg:'Nutze die angegebene Bedingung für x und schreibe das Ergebnis ohne Betragszeichen.'};if(task.mode==='expand'&&(has(ast,'^')||unexpanded(ast)))return{ok:false,msg:'Multipliziere die Klammern aus und fasse die Produkte zusammen.'};const actual=calc(ast),expected=calc(parse(task.answer));if(canon(actual)===canon(expected)){const factor=remainingFactor(ast);if(factor>1n)return{ok:false,code:'not_reduced',msg:`Dein Term ist gleichwertig, aber noch nicht vollständig gekürzt. Vereinfache bei Bedarf die Wurzeln im Zähler und kürze den Bruch noch durch ${factor}. Der Nenner soll rational bleiben.`};return{ok:true,ast};}return{ok:false,msg:task.feedback||'Der Term ist noch nicht gleichwertig. Prüfe deinen Rechenweg oder nutze den nächsten Hinweis.'};}catch(e){return{ok:false,msg:e.message};}}

    s.solved=Array.isArray(raw.solved)?[...new Set(raw.solved.filter(id=>getTask(id)))]:[];
    s.rooms=Array.isArray(raw.rooms)?[...new Set(raw.rooms.filter(id=>getRoom(id)))]:[];
    for(const key of ['answers','drafts','errorLines','choices','codes','reflections']){if(raw[key]&&typeof raw[key]==='object'&&!Array.isArray(raw[key])) for(const [k,v] of Object.entries(raw[key]))if(typeof v==='string'&&k!=='__proto__'&&k!=='constructor')s[key][k]=v.slice(0,4000);}
    for(const key of ['hints','attempts'])for(const t of tasks)s[key][t.id]=Math.max(0,Math.min(key==='hints'?2:10000,Number(raw[key]?.[t.id])||0));

    if(raw.timer&&Number.isFinite(raw.timer.remaining)&&Number.isFinite(raw.timer.since)&&typeof raw.timer.running==='boolean')s.timer={remaining:Math.max(-86400000,Math.min(180*60000,raw.timer.remaining)),since:raw.timer.since,running:raw.timer.running};
    else if(raw.timer&&Number.isFinite(raw.timer.remaining))s.timer={remaining:raw.timer.remaining,running:false,since:null};

function timeText(ms){const n=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function bar(){return `<div class="gamebar"><div><h2>Operation Ausgang</h2><div class="team">${esc(state.team)} · ${roomCount()} / 6 Räume</div></div><div class="time" id="time-box"><div><strong id="clock">${timeText(EscapeCore.remaining(state))}</strong><div id="timer-caption" class="small muted">${state.timer.running?'Spielzeit verbleibend':'Uhr pausiert'}</div></div><button data-action="timer" id="pause-clock" ${state.rooms.includes('exit')?'disabled':''}>${state.timer.running?'Pause':'Weiter'}</button></div></div>`;}
function sidebar(){const items=EscapeCore.items(state);return `<aside class="sidebar"><section class="sidebox"><h3>Euer Inventar <span class="muted">${items.length}/5</span></h3><div class="inventory">${items.length?items.map(id=>{const it=GAME.items[id];return `<button class="item" data-item="${id}"><span class="item-icon" aria-hidden="true">${it.symbol}</span><span>${it.name}<small>${id==='lamp'?'Untersuchen / benutzen':id==='route'?'Reihenfolge lesen':'Wert ansehen'}</small></span></button>`;}).join(''):'<p class="small muted">Noch leer. Sucht in der Energiezentrale nach einem Werkzeug.</p>'}</div></section><section class="sidebox"><h3>Archivplan</h3><nav class="nav-list" aria-label="Räume"><button data-go="map" class="nav-room ${state.view==='map'?'current':''}">⌂ Übersicht</button>${GAME.rooms.map(r=>`<button class="nav-room ${state.view===r.id?'current':''}" data-go="${r.id}" ${EscapeCore.access(state,r.id)?'':'disabled'}>${r.icon} ${r.short}<span class="status">${state.rooms.includes(r.id)?'✓':EscapeCore.access(state,r.id)?'→':'○'}</span></button>`).join('')}<button data-go="bonus" class="nav-room" ${state.rooms.includes('power')?'':'disabled'}>✦ Forschungsfach</button></nav><div class="progress-rail"><div class="progress-fill" style="width:${roomCount()/6*100}%"></div></div><span class="small muted">${roomCount()} von 6 Räumen geöffnet</span></section><section class="sidebox"><h3>Ermittlungsnotizen</h3><label class="screen-reader" for="notes">Eure Hinweise und Ideen</label><textarea id="notes" maxlength="8000" placeholder="Hinweise, Zahlen, Vermutungen …">${esc(state.notes)}</textarea><p class="small muted" style="margin:7px 0">Wird mit dem Spielstand gespeichert.</p><button data-action="export" class="quiet small">Protokoll sichern ↓</button></section></aside>`;}
function mapView(){const next=state.rooms.includes('control')?'Mit der Routenkarte könnt ihr den Ausgang suchen.':['prism','mirror','resonance'].every(id=>state.rooms.includes(id))?'Die drei Plättchen öffnen den Kontrollraum.':state.rooms.includes('power')?'Drei Räume sind offen. Ihr entscheidet, welchen ihr zuerst untersucht.':'Beginnt in der Energiezentrale. Der Rest des Archivs braucht Strom.';return `<div class="map-top"><div><p class="eyebrow">ARCHIVPLAN / SEKTOR II</p><h1>Wo führt euer Weg hin?</h1><p class="muted">${next}</p></div><span class="tag gold">${state.rooms.includes('exit')?'Ausgang geöffnet':'Mission läuft'}</span></div><div class="map"><div class="map-grid"></div><div class="map-label">WARTUNGSPLAN 09–II / 6 SEKTOREN</div><svg viewBox="0 0 900 490" aria-hidden="true"><g fill="none" stroke="#64828b" stroke-width="2" stroke-dasharray="7 8"><path d="M135 240H235V110H345M235 240V350H345M345 110H550M345 350H550M550 110H660V350H550M660 240H755"/></g><g fill="#f4c17a"><circle cx="235" cy="240" r="5"/><circle cx="660" cy="240" r="5"/></g></svg>${GAME.rooms.map(r=>`<button class="map-room ${state.rooms.includes(r.id)?'done':''}" style="left:${r.x/9}%;top:${r.y/4.9}%" data-go="${r.id}" ${EscapeCore.access(state,r.id)?'':'disabled'} aria-label="${r.title}, ${state.rooms.includes(r.id)?'geöffnet':EscapeCore.access(state,r.id)?'erkunden':'verschlossen'}"><span class="glyph">${r.icon}</span><strong>${r.short}</strong><small>${state.rooms.includes(r.id)?'✓ geöffnet':EscapeCore.access(state,r.id)?`ca. ${r.minutes} Min. · erkunden`:'noch verschlossen'}</small></button>`).join('')}</div><div class="map-legend"><span><b>✓</b> geöffnet / Fundstück erhalten</span><span>→ zugänglich</span><span>○ verschlossen</span></div>${state.rooms.includes('power')?`<div class="bonus-callout"><h3>✦ Das Forschungsfach</h3><p>Ihr kommt zügig voran oder seid schon entkommen? Drei freiwillige Rätsel fordern euch zusätzlich heraus. Sie sind für den Ausgang nicht nötig.</p><button data-go="bonus" class="quiet">Forschungsfach öffnen →</button></div>`:''}${state.rooms.includes('exit')?'<div class="reward"><h2>Der Weg nach draußen ist frei.</h2><button class="mint" data-go="end">Zur Auswertung →</button></div>':''}`;}
function scene(r){return `<div class="scene"><div class="scene-top"><div class="scene-instrument ${r.id}" aria-hidden="true">${(r.id==='power'?['ϟ','≈','○']:r.id==='exit'?['◇','△','○']:['Ⅰ','Ⅱ','Ⅲ','Ⅳ']).map(g=>`<i>${g}</i>`).join('')}</div><div><p class="eyebrow">RAUM ${r.nr} / ${r.level}</p><h3>${r.object}</h3><p class="muted">${r.mission}</p></div></div><div class="objects"><button data-area="terminal" class="${state.area==='terminal'?'active':''}"><span>01 · untersuchen</span><b>${r.object}</b></button><button data-area="note" class="${state.area==='note'?'active':''}"><span>02 · Hinweis lesen</span><b>${r.noteTitle}</b></button><button data-area="lock" class="${state.area==='lock'?'active':''}"><span>03 · Mechanismus</span><b>${r.lockTitle}</b></button></div></div>`;}
function tasksView(r){return `<div class="section-heading"><h2>${r.object}</h2><span class="tag">${r.tasks.filter(solved).length}/${r.tasks.length} geprüft</span></div><p class="small muted">Notiert den Rechenweg auf eurem Papier. Gleichwertige Schreibweisen werden erkannt. Ergebnisse müssen vollständig vereinfacht sein.</p>${r.tasks.map(taskHTML).join('')}<div class="actions"><button data-area="lock" class="primary">Zum Mechanismus →</button><button data-area="note" class="quiet">Hinweis lesen</button></div>`;}
function taskHTML(t){const done=solved(t),used=state.hints[t.id]||0;return `<article class="task ${done?'solved':''}" id="task-${t.id}"><div class="task-head"><div><span class="task-id">${t.id}${done?' · ✓ GEPRÜFT':''}</span><h3>${t.label}</h3></div>${level(t.level)}</div>${t.symbolic?`<div class="formula symbolic">${esc(t.symbolic)}</div>`:t.given?`<div class="formula">${M(t.given)}</div>`:''}<p>${t.prompt}</p>${t.extract?`<p class="small muted">${t.extract}</p>`:''}${t.errorWork?`<div class="worklines" aria-label="Zu prüfender Rechenweg">${t.errorWork.map((line,i)=>`<div class="workline"><b>Zeile ${i+1}</b><span>= ${M(line)}</span></div>`).join('')}</div>`:''}${done?`<div class="solved-answer"><b>✓ ${t.type==='choice'?`Protokoll ${esc(state.answers[t.id])} bestätigt`:'Ergebnis geprüft'}</b>${t.type==='choice'?'':`<div class="mathline">${M(state.answers[t.id])}</div>`}${t.errorLine?`<span>Erster Fehler: Zeile ${t.errorLine}. Eure Begründung gehört aufs Papier.</span>`:''}</div>`:`<form class="task-form" data-task="${t.id}">${t.errorWork?`<label class="error-select form-label" for="line-${t.id}">Erster falscher Schritt<select id="line-${t.id}" data-line="${t.id}" required><option value="">Zeile auswählen …</option>${t.errorWork.map((_,i)=>`<option value="${i+1}" ${state.errorLines[t.id]===String(i+1)?'selected':''}>Zeile ${i+1}</option>`).join('')}</select></label>`:''}${t.type==='choice'?`<div class="choice-list">${t.choices.map(c=>`<label class="choice"><input type="radio" name="choice-${t.id}" value="${c.id}" data-choice="${t.id}" ${state.choices[t.id]===c.id?'checked':''} required><b>${c.id}</b><span class="mathline">${M(c.left)} = ${M(c.right)}</span></label>`).join('')}</div><button type="submit" class="mint">Protokoll prüfen</button>`:`<label class="form-label" for="answer-${t.id}">Vereinfachter Ergebnisterm</label><div class="answer-row"><input id="answer-${t.id}" data-answer="${t.id}" value="${esc(state.drafts[t.id]||'')}" maxlength="150" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ergebnis eingeben" required aria-describedby="feedback-${t.id}"><button type="submit" class="mint">Prüfen</button></div><div class="keys"><button type="button" data-insert="root" data-target="${t.id}" aria-label="Wurzel eingeben">√</button><button type="button" data-insert="abs" data-target="${t.id}" aria-label="Betrag eingeben">|…|</button><button type="button" data-insert="fraction" data-target="${t.id}" aria-label="Bruch eingeben">a/b</button><span class="help">z. B. 2*sqrt(3)/5 oder |x-4|</span></div><div class="preview" id="preview-${t.id}">${state.drafts[t.id]?M(state.drafts[t.id]):''}</div>`}<div id="feedback-${t.id}" role="status" aria-live="polite"></div></form>`}<div class="task-foot"><button class="hint-btn" data-hint="${t.id}" ${used>=t.hints.length?'disabled':''}>${used>=t.hints.length?'Beide Hinweise geöffnet':`Hinweis ${used+1} von 2 öffnen`}</button></div>${used?`<div class="hints">${t.hints.slice(0,used).map((h,i)=>`<p><b>${i+1}.</b> ${h}</p>`).join('')}</div>`:''}</article>`;}
function roomView(r){const done=state.rooms.includes(r.id);return `<button data-go="map" class="back">← Zum Archivplan</button><div class="room-heading"><span class="room-glyph" aria-hidden="true">${r.icon}</span><div><p class="eyebrow">RAUM ${r.nr} · CA. ${r.minutes} MINUTEN</p><h1>${r.title}</h1><span class="tag">${r.level}</span></div></div><div class="story"><p>${r.intro}</p></div>${scene(r)}${done?rewardView(r):''}<div id="room-area">${state.area==='terminal'?tasksView(r):state.area==='note'?`<article class="paper"><p class="eyebrow">FUNDSTÜCK / ${r.nr}</p><h3>${r.noteTitle}</h3><p>${r.note}</p></article><div class="actions"><button data-area="terminal">Zum Terminal</button><button data-area="lock" class="primary">Zum Mechanismus →</button></div>`:state.area==='lock'?lockView(r):`<p class="muted small">Untersucht die beschrifteten Objekte im Raum. Es gibt keine unsichtbaren Klickstellen.</p>`}</div>`;}
function rewardView(r){if(r.id==='exit')return `<div class="reward"><h2>Der Ausgang ist offen.</h2><p>Ihr habt alle Hinweise verbunden und könnt das Archiv verlassen.</p><button class="mint" data-go="end">Zur Auswertung →</button></div>`;const it=GAME.items[r.reward];return `<div class="reward" role="status"><span class="symbol">${it.symbol}</span><h2>${r.reward==='route'?'Route gefunden.':'Raum geöffnet.'}</h2><p><b>${it.name}</b> ist in eurem Inventar. ${it.text}</p><button class="mint" data-go="${r.id==='control'?'exit':'map'}">${r.id==='control'?'Zum verborgenen Ausgang':'Weiter erkunden'} →</button></div>`;}
function powerLockSummary(r){const ready=EscapeCore.roomReady(state,r.id);return `<div class="code-guide"><h3>Eure Ergebnisse</h3><table class="schedule"><thead><tr><th>Reihenfolge am Mechanismus</th><th>Euer Ergebnis</th></tr></thead><tbody>${['S1','S2','S3'].map((id,i)=>{const t=EscapeCore.getTask(id);return `<tr><th scope="row">${i+1}. ${t.label}</th><td>${solved(t)?M(t.answer):'<span class="muted">Noch zu berechnen</span>'}</td></tr>`;}).join('')}</tbody></table><p class="code-instruction">Tragt die Zahl außerhalb der Wurzel bzw. das gesamte Ergebnis in der festgelegten Reihenfolge <strong>Blitz – Welle – Ring</strong> ein. Schreibt die drei Zahlen ohne Leerzeichen hintereinander.</p>${ready?'':'<p class="small muted">Löst zuerst die drei Aufgaben. Eure geprüften Ergebnisse erscheinen dann in der Tabelle.</p>'}</div>`;}
function lockView(r){if(state.rooms.includes(r.id))return (r.id==='power'?powerLockSummary(r):'')+`<p class="small muted">Dieser Mechanismus ist bereits geöffnet. Die Aufgaben und Hinweise bleiben zugänglich.</p>`;const ready=EscapeCore.roomReady(state,r.id),n=r.tasks.filter(solved).length;let body=r.id==='power'?powerLockSummary(r):'';if(r.id==='mirror')body=`<div class="mirror-controls">${r.factors.map((f,i)=>`<div class="mirror-control"><label for="mirror-${i}">Spiegel ${'ABCD'[i]}</label><div class="factor">${f}</div><select id="mirror-${i}" data-mirror="${i}" aria-label="Vorzeichen für Spiegel ${'ABCD'[i]}"><option value="">Vorzeichen …</option><option value="+" ${state.signs[i]==='+'?'selected':''}>+ (Summe)</option><option value="−" ${state.signs[i]==='−'?'selected':''}>− (Differenz)</option></select></div>`).join('')}</div><button class="primary" type="submit" ${ready?'':'disabled'}>Lichtstrahl senden →</button>`;
else if(r.id==='control')body=`<button class="primary" type="submit" ${ready?'':'disabled'}>Protokolle freigeben & Routenkarte nehmen →</button>`;
else {const uv=r.id==='resonance';if(uv)body+=state.uv?`<div class="uv-grid">${r.probes.map(p=>`<div class="uv-card"><b>${p.label.toUpperCase()}</b><span>x = ${p.x<0?'−'+Math.abs(p.x):p.x}</span></div>`).join('')}</div><p class="small muted">UV-Lampe aktiv. Die vier Messergebnisse bilden den Code.</p>`:`<div class="blacklight"><div><b>Vier Messpunkte bleiben unsichtbar.</b><p class="small">Ein Werkzeug aus eurem Inventar könnte helfen.</p><button type="button" data-action="uv" class="quiet">UV-Lampe benutzen</button></div></div>`;
body+=`<label class="form-label" for="lock-code">${r.code.length}-stelliger Code</label><div class="answer-row"><input class="lock-input" id="lock-code" data-code="${r.id}" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="${'·'.repeat(r.code.length)}" value="${esc(state.codes[r.id]||'')}" aria-describedby="lock-feedback"><button type="submit" class="primary" ${ready&&(!uv||state.uv)?'':'disabled'}>Schloss öffnen →</button></div>`;}
return `<section class="lock-panel"><span class="lock-icon" aria-hidden="true">${r.icon}</span><h2>${r.lockTitle}</h2><p>${r.lockText}</p>${!ready?`<p class="notice">${n} von ${r.tasks.length} Aufgaben geprüft. Bevor sich der Mechanismus einschalten lässt, müssen alle Ergebnisse stimmen. <button class="quiet" type="button" data-area="terminal">Zum Terminal</button></p>`:''}<form id="lock-form" data-room="${r.id}">${body}<div id="lock-feedback" role="status" aria-live="polite"></div></form><details><summary>Hinweis zum Mechanismus</summary><div>${r.note}</div></details></section>`;}
function bonusView(){return `<button data-go="map" class="back">← Zum Archivplan</button><p class="eyebrow">FREIWILLIG / FÜR NEUGIERIGE</p><h1>Das Forschungsfach</h1><p class="lead">Drei rätselhafte Notizen aus dem alten Archiv. Sie sind anspruchsvoller als der Hauptweg. Ihr könnt sie jederzeit liegen lassen und eure Mission fortsetzen.</p>${GAME.bonus.map(taskHTML).join('')}${GAME.bonus.every(solved)?'<div class="reward"><h2>✦ Alle Forschungsnotizen entschlüsselt.</h2><p>Ihr habt auch die zusätzlichen Zusammenhänge aufgedeckt.</p></div>':''}<button data-go="${state.rooms.includes('exit')?'end':'map'}" class="primary">${state.rooms.includes('exit')?'Zur Auswertung':'Zur Mission'} →</button>`;}
function endView(){const spent=Math.max(0,75*60000-EscapeCore.remaining(state));return `<section class="success-hero"><div class="open-glyph">↗</div><p class="eyebrow">ARCHIV 09 / AUSGANG WIEDERHERGESTELLT</p><h1>Ihr habt den Weg gefunden.</h1><p>Die Plättchen greifen ineinander. Die Wand wird durchsichtig – dahinter liegt die Ausgangstür. Das Archiv speichert eure letzte Nachricht: <b>„Gleicher Wert. Richtige Form. Freier Weg.“</b></p><div class="success-stats"><div><strong>6 / 6</strong><span>Räume geöffnet</span></div><div><strong>22</strong><span>Aufgaben geprüft</span></div><div><strong>${Math.ceil(spent/60000)} Min.</strong><span>aktive Spielzeit</span></div></div></section><div class="section-heading"><h2>Die letzten zehn Minuten</h2><span class="tag">Auswertung</span></div><p class="muted">Vergleicht eure Rechenwege. Wählt für das Klassengespräch einen hilfreichen Hinweis und einen Fehler, aus dem ihr etwas gelernt habt.</p><div class="reflection-grid"><label>1. Erklärt an einem Beispiel, wie ihr einen Nenner rational gemacht habt.<textarea data-reflection="method" maxlength="3000">${esc(state.reflections.method||'')}</textarea></label><label>2. Warum braucht man bei √((x − 2)²) Betragszeichen? Nennt eine passende Zahl für x.<textarea data-reflection="absolute" maxlength="3000">${esc(state.reflections.absolute||'')}</textarea></label><label>3. Welches Rätsel war schwierig? Welche Frage bleibt offen?<textarea data-reflection="question" maxlength="3000">${esc(state.reflections.question||'')}</textarea></label></div><div class="actions" style="margin-top:20px"><button data-action="report" class="mint">Lernprotokoll drucken</button><button data-action="export">Protokoll als Text sichern ↓</button><button data-go="bonus" class="quiet">Zu den Zusatzrätseln →</button></div><p class="small muted" style="margin-top:15px">Eure Notizen bleiben auf diesem Gerät. Zum Abgeben könnt ihr das Lernprotokoll drucken oder als PDF speichern.</p>`;}
function render(){if(!state.started||state.view==='intro'){$('main').innerHTML=intro();return;}if(GAME.rooms.some(r=>r.id===state.view)&&!EscapeCore.access(state,state.view))state.view='map';if(state.view==='end'&&!state.rooms.includes('exit'))state.view='map';const content=state.view==='map'?mapView():state.view==='bonus'?bonusView():state.view==='end'?endView():roomView(EscapeCore.getRoom(state.view));$('main').innerHTML=bar()+`<div class="layout"><section>${content}</section>${sidebar()}</div>`;tick();}
function feedback(id,msg,ok=false){const el=$(id);if(!el)return;el.className='feedback'+(ok?' ok':'');el.textContent=msg;}
function showDialog(title,html){$('dialog-title').textContent=title;$('dialog-body').innerHTML=html;if(!$('overlay').open)$('overlay').showModal();}
function rules(){showDialog('Werkzeugkasten',`<p>Hier könnt ihr Bekanntes nachschlagen. Die binomischen Formeln werden vorausgesetzt.</p><details open><summary>Wurzelrechnen</summary><div><div class="mathline">${M('sqrt(50)')} = ${M('5*sqrt(2)')}</div><p>Zerlegt den Radikanden in einen Quadratfaktor und den Rest. Gleichartige Wurzelterme lassen sich zusammenfassen.</p><div class="mathline">${M('7*sqrt(3)-2*sqrt(3)')} = ${M('5*sqrt(3)')}</div></div></details><details><summary>Eine Wurzel im Nenner</summary><div><p>Erweitert Zähler und Nenner mit derselben Wurzel. Kürzt anschließend vollständig.</p><div class="mathline">${M('4/sqrt(6)')} = ${M('4*sqrt(6)/6')} = ${M('2*sqrt(6)/3')}</div></div></details><details><summary>Summe oder Differenz im Nenner</summary><div><p>Erweitert mit dem passenden Gegenfaktor. Im Nenner entsteht eine Differenz von Quadraten.</p><div class="mathline">${M('1/(sqrt(3)+1)')} = ${M('(sqrt(3)-1)/(3-1)')} = ${M('(sqrt(3)-1)/2')}</div></div></details><details><summary>Binomisches Quadrat unter der Wurzel</summary><div><p>Erkennt zuerst das Quadrat. Die Quadratwurzel ist nicht negativ, deshalb braucht ihr gegebenenfalls den Betrag.</p><div class="mathline">${M('sqrt(x^2+6*x+9)')} = ${M('sqrt((x+3)^2)')} = ${M('abs(x+3)')}</div><p>Ist der Term im Betrag negativ, kehrt sich beim Auflösen sein Vorzeichen um.</p></div></details><details><summary>Ergebnisse eingeben</summary><div><p>Brüche: <code>(sqrt(5)+1)/2</code>. Wurzeln: <code>sqrt(5)</code> oder die Taste √. Betrag: <code>|x-3|</code> oder <code>abs(x-3)</code>. Malzeichen: <code>*</code>. Dezimalwerte sind hier meist nicht die gesuchte exakte Form.</p><p>Setzt Summen im Zähler in Klammern. Unter eurer Eingabe erscheint eine mathematische Vorschau.</p></div></details><p class="small muted">Ihr könnt die Spieluhr über „Pause“ anhalten. Bei 00:00 bleibt das Archiv spielbar. Es gibt keine Strafzeit für Hinweise oder falsche Versuche.</p>`);}
const scheduleHTML=()=>`<table class="schedule"><thead><tr><th>Phase</th><th>Zeit</th><th>Schwerpunkt</th></tr></thead><tbody><tr><td>Auftrag, Gerät und Rechenpapier</td><td>5 Min.</td><td>Geschichte, Arbeitsweise, Eingabe</td></tr>${GAME.rooms.map(r=>`<tr><td>${r.nr} · ${r.title}</td><td>${r.minutes} Min.</td><td>${r.level}</td></tr>`).join('')}<tr><td>Gemeinsame Auswertung</td><td>10 Min.</td><td>Wege vergleichen, Fehlvorstellungen besprechen</td></tr><tr><th>Gesamt</th><th>90 Min.</th><th>Davon 75 Minuten Spielzeit</th></tr></tbody></table>`;
function solutionsHTML(){return GAME.rooms.map(r=>`<details><summary>${r.nr} · ${r.title}${r.code?` — Code ${r.code}`:''}</summary><div>${r.tasks.map(t=>`<p><b>${t.id} · ${t.label}</b>${t.errorLine?` — erster Fehler: Zeile ${t.errorLine}`:''}</p><div class="mathline">${t.type==='choice'?`Protokoll ${t.answer}`:t.steps.map(M).join(' = ')}</div>${t.reason?`<p class="small">${t.reason}</p>`:''}`).join('')}<p><b>Mechanismus:</b> ${r.id==='mirror'?'Gegenfaktoren: √3 − 1; √7 + 2; 3 + √5; √6 − √2. Schalter: −, +, +, −.':r.id==='resonance'?'UV-Lampe benutzen. Nord: |−7 + 4| = 3. Ost: |1 − 5| = 4. Süd: |3·(−1) + 2| = 1. West: 3 − 1 = 2. Code: 3412.':r.id==='control'?'Nach allen vier Protokollen die Steuerung freigeben. Routenkarte: Raute → Dreieck → Kreis.':`${r.note} Code: ${r.code}.`}</p>${r.reward?`<p><b>Fundstück:</b> ${GAME.items[r.reward].name}. ${GAME.items[r.reward].text}</p>`:''}</div></details>`).join('')+`<details><summary>Forschungsfach — Zusatzlösungen</summary><div>${GAME.bonus.map(t=>`<p><b>${t.id}</b></p><div class="mathline">${t.steps.map(M).join(' = ')}</div>`).join('')}</div></details>`;}
function teacher(){showDialog('Für die Lehrkraft',`<p class="notice">Dieser Bereich enthält die vollständigen Lösungen und Schlosscodes.</p><p>Die Fortsetzung setzt die drei Inhalte der Vorbereitung voraus: Nenner rational machen, Gegenfaktoren nutzen und binomische Quadrate unter einer Wurzel erkennen. Die Aufgaben sind neu zusammengestellt und orientieren sich an diesen Themen aus LS 9, S. 23–25.</p><h3>Ablauf der Doppelstunde</h3>${scheduleHTML()}<p class="small muted">Die Zeiten sind Planwerte, keine garantierte Bearbeitungsdauer. Nach der Energiezentrale sind Prismenlabor, Spiegelkammer und Resonanzraum in beliebiger Reihenfolge zugänglich.</p><h3>Organisation und Differenzierung</h3><ul class="mini-list"><li>Ein Gerät und Rechenpapier pro Person, Paar oder Team. Bei Gruppenarbeit Rollen wechseln: rechnen, Rechenweg prüfen, Hinweise lesen und Eingabe.</li><li>Rechenwege schriftlich festhalten. Ergebnisse und Fehlerzeilen werden automatisch geprüft; Begründungen werden im Gespräch oder auf dem Rechenbogen geprüft.</li><li>Bei Schwierigkeiten zunächst die zwei Hinweise der Aufgabe nutzen. Bei Zeitknappheit gezielt einen Zwischenschritt geben. Die Uhr darf pausiert werden; bei Zeitablauf gibt es keinen Abbruch.</li><li>Drei optionale Aufgaben im Forschungsfach vertiefen die Inhalte. Sie sind keine Voraussetzung für die Flucht.</li><li>Die Spielstände liegen lokal im jeweiligen Browser. Vor einem Gerätewechsel das Textprotokoll sichern; es ist ein Lernnachweis, kein importierbarer Spielstand.</li><li>Die Lösungsansicht ist zugänglich und kein geschützter Prüfungsbereich. Das Spiel ist eine Lernaktivität.</li></ul><div class="actions"><button class="primary" data-action="print-teacher">Leitfaden mit Lösungen drucken</button><button data-action="worksheet">Rechenbogen drucken</button></div><h3 style="margin-top:25px">Lösungen & Freigaben</h3>${solutionsHTML()}`);}
function item(id){if(!EscapeCore.items(state).includes(id))return;const it=GAME.items[id];showDialog(it.name,`<div class="formula symbolic">${it.symbol}</div><p>${it.text}</p>${id==='lamp'?'<p>Im Resonanzraum könnt ihr damit die unsichtbaren Messpunkte aufdecken.</p><button class="primary" data-action="uv-dialog">Im Resonanzraum benutzen →</button>':''}`);}
function useUV(){if(!EscapeCore.items(state).includes('lamp')){notify('Die UV-Lampe liegt noch im Werkzeugfach der Energiezentrale.');return;}state.uv=true;$('overlay').close();go('resonance','lock');notify('Im UV-Licht erscheinen vier Messpunkte.');}
function answerTask(id,raw){const t=EscapeCore.getTask(id);state.attempts[id]=(state.attempts[id]||0)+1;const result=EscapeCore.checkTask(id,raw,state.errorLines[id]);if(result.ok){if(!state.solved.includes(id))state.solved.push(id);state.answers[id]=raw;save();const el=$('task-'+id);el.outerHTML=taskHTML(t);const next=$('task-'+id);next.setAttribute('tabindex','-1');next.focus({preventScroll:true});notify(`✓ ${id} geprüft. Haltet euren Rechenweg fest.`);const header=document.querySelector('#room-area .section-heading .tag');if(header){const r=EscapeCore.getRoom(state.view);header.textContent=`${r.tasks.filter(solved).length}/${r.tasks.length} geprüft`;}if(state.view==='bonus'&&GAME.bonus.every(solved))notify('Alle drei Forschungsnotizen sind entschlüsselt.');}else{save();feedback('feedback-'+id,result.msg||'Prüft den Ergebnisterm noch einmal.');}}
function openLock(id,value){const result=EscapeCore.checkLock(state,id,value);if(!result.ok){feedback('lock-feedback',result.msg);return;}if(!state.rooms.includes(id))state.rooms.push(id);if(id==='exit'){state.timer.remaining=EscapeCore.remaining(state);state.timer.running=false;state.timer.since=null;state.view='end';}save();render();$('main').focus();window.scrollTo({top:0,behavior:'instant'});notify(id==='exit'?'Der Ausgang ist offen. Ihr habt es geschafft!':`Geöffnet: ${EscapeCore.getRoom(id).title}. Ein neues Fundstück wartet im Inventar.`);}
function pauseTimer(){if(state.rooms.includes('exit'))return;if(state.timer.running){state.timer.remaining=EscapeCore.remaining(state);state.timer.running=false;state.timer.since=null;}else{state.timer.running=true;state.timer.since=Date.now();}save();tick();}
function tick(){const clock=$('clock');if(!clock)return;const rem=EscapeCore.remaining(state);clock.textContent=timeText(rem);$('time-box').classList.toggle('overtime',rem<=0);$('timer-caption').textContent=state.rooms.includes('exit')?'Mission abgeschlossen':rem<=0?'Zeitfenster vorbei · weiter möglich':state.timer.running?'Spielzeit verbleibend':'Uhr pausiert';$('pause-clock').textContent=state.timer.running?'Pause':'Weiter';if(rem<=0&&!state.expired&&!state.rooms.includes('exit')){state.expired=true;save();notify('Die geplante Spielzeit ist um. Ihr könnt weiterspielen oder gemeinsam auswerten.');}}
function reportText(){return [`WURZELARCHIV II – LERNPROTOKOLL`,`Team: ${state.team}`,`Geöffnete Räume: ${state.rooms.map(id=>EscapeCore.getRoom(id).title).join(', ')||'noch keine'}`,'',...EscapeCore.tasks.map(t=>`${t.id}: ${state.solved.includes(t.id)?state.answers[t.id]:'noch offen'}${state.hints[t.id]?` (${state.hints[t.id]} Hinweise)` : ''}`),'','NOTIZEN',state.notes,'','AUSWERTUNG',`Rationale Nenner: ${state.reflections.method||''}`,`Betrag: ${state.reflections.absolute||''}`,`Offene Frage: ${state.reflections.question||''}`].join('\n');}
function downloadReport(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Wurzelarchiv-II-Lernprotokoll.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printTask(t,answers=false){return `<div class="print-task"><h3>${t.id} · ${t.label}</h3>${t.symbolic?`<p><b>${esc(t.symbolic)}</b></p>`:t.given?`<div class="mathline">${M(t.given)}</div>`:''}<p>${t.prompt}</p>${t.errorWork?t.errorWork.map((s,i)=>`<p>Zeile ${i+1}: ${M(s)}</p>`).join(''):''}${t.type==='choice'?t.choices.map(c=>`<p>${c.id}: ${M(c.left)} = ${M(c.right)}</p>`).join(''):''}${answers?`<p><b>Lösung:</b> ${t.type==='choice'?t.answer:M(t.answer)}${t.errorLine?` · Erster Fehler: Zeile ${t.errorLine}`:''}</p>${t.reason?`<p>${t.reason}</p>`:''}`:'<div class="writing-lines"></div>'}</div>`;}
function printDoc(mode){let html='';if(mode==='worksheet')html=`<h1>Wurzelarchiv II · Rechenbogen</h1><p>Name / Team: ____________________________________ Datum: ______________</p><p>Notiert Rechenwege, Hinweise und Begründungen. Kein Taschenrechner. Die Spieluhr umfasst 75 Minuten; Einstieg und Auswertung ergänzen die 90 Minuten.</p>${GAME.rooms.map((r,i)=>`<section class="${i?'page-start':''}"><h2>${r.nr} · ${r.title}</h2><p>${r.mission}</p>${r.tasks.map(t=>printTask(t)).join('')}<p><b>Unsere Hinweise / Kombination:</b></p><div class="writing-lines"></div></section>`).join('')}<section class="page-start"><h2>Freiwillig: Das Forschungsfach</h2>${GAME.bonus.map(t=>printTask(t)).join('')}</section><section class="page-start"><h2>Auswertung</h2><p>Wie macht man einen Nenner rational? Erkläre es an einem Beispiel.</p><div class="writing-lines long-lines"></div><p>Warum gilt √((x − 2)²) = |x − 2|? Nenne eine Zahl, bei der die Betragszeichen nötig sind.</p><div class="writing-lines long-lines"></div><p>Welcher Hinweis war hilfreich? Welche Frage bleibt?</p><div class="writing-lines long-lines"></div></section>`;
else if(mode==='teacher')html=`<h1>Wurzelarchiv II · Lehrkraft</h1><p>Der verschwundene Ausgang · Klasse 9C · 90 Minuten</p>${scheduleHTML()}<p>Hinweise: Rechenpapier, kein Taschenrechner; Rollenwechsel bei Gruppenarbeit. Zwei Hinweise pro Aufgabe. Kein Abbruch bei Ablauf der Uhr. Begründungen werden schriftlich oder mündlich geprüft. Forschungsfach optional.</p>${GAME.rooms.map(r=>`<section class="page-start"><h2>${r.nr} · ${r.title}</h2><p>${r.note}</p><p><b>Mechanismus:</b> ${r.code?'Code '+r.code:r.id==='mirror'?'Spiegelstellungen: −, +, +, −.':'Alle Protokolle prüfen, dann Freigabe.'}</p>${r.reward?`<p><b>Fundstück:</b> ${GAME.items[r.reward].name}. ${GAME.items[r.reward].text}</p>`:''}${r.id==='resonance'?'<p>Messwerte: Nord 3; Ost 4; Süd 1; West 2.</p>':''}${r.tasks.map(t=>printTask(t,true)).join('')}</section>`).join('')}<section class="page-start"><h2>Zusatzlösungen</h2>${GAME.bonus.map(t=>printTask(t,true)).join('')}</section>`;
else html=`<h1>Wurzelarchiv II · Lernprotokoll</h1><p><b>Team:</b> ${esc(state.team)} · ${roomCount()} von 6 Räumen geöffnet</p>${GAME.rooms.map(r=>`<h2>${r.title}</h2>${r.tasks.map(t=>`<p><b>${t.id}</b>: ${solved(t)?(t.type==='choice'?'Protokoll '+esc(state.answers[t.id]):M(state.answers[t.id])):'noch offen'}${state.hints[t.id]?` · ${state.hints[t.id]} Hinweise`:''}</p>`).join('')}`).join('')}<h2>Notizen</h2><p class="print-note">${esc(state.notes||'Keine Notizen gespeichert.')}</p><h2>Auswertung</h2>${[['method','Rationale Nenner'],['absolute','Betragszeichen'],['question','Schwierigkeiten / offene Frage']].map(([k,label])=>`<h3>${label}</h3><p class="print-note">${esc(state.reflections[k]||'Noch nicht beantwortet.')}</p>`).join('')}`;
$('print-root').innerHTML=html;if($('overlay').open)$('overlay').close();window.print();}
document.addEventListener('submit',e=>{if(e.target.id==='start-form'){e.preventDefault();state.team=$('team-name').value.trim()||state.team||'Archivteam';if(!state.started){state.started=true;state.timer.running=true;state.timer.since=Date.now();}go(state.rooms.includes('exit')?'end':'map');}else if(e.target.classList.contains('task-form')){e.preventDefault();const id=e.target.dataset.task,t=EscapeCore.getTask(id),raw=t.type==='choice'?state.choices[id]||'':$('answer-'+id).value.trim();answerTask(id,raw);}else if(e.target.id==='lock-form'){e.preventDefault();openLock(e.target.dataset.room,$('lock-code')?.value||'');}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.answer){state.drafts[el.dataset.answer]=el.value;$('preview-'+el.dataset.answer).innerHTML=el.value?M(el.value):'';const fb=$('feedback-'+el.dataset.answer);fb.textContent='';fb.className='';save();}else if(el.id==='notes'){state.notes=el.value;save();}else if(el.dataset.code){state.codes[el.dataset.code]=el.value;save();}else if(el.dataset.reflection){state.reflections[el.dataset.reflection]=el.value;save();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.line){state.errorLines[el.dataset.line]=el.value;save();}else if(el.dataset.choice){state.choices[el.dataset.choice]=el.value;save();}else if(el.dataset.mirror!==undefined){state.signs[Number(el.dataset.mirror)]=el.value;save();}});
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.id==='brand'){e.preventDefault();state.view=state.started?'map':'intro';save();render();window.scrollTo(0,0);}else if(b.id==='rules-button')rules();else if(b.id==='teacher-button')teacher();else if(b.id==='close-dialog')$('overlay').close();else if(b.id==='worksheet-button'||b.dataset.action==='worksheet')printDoc('worksheet');else if(b.id==='restart-button')showDialog('Ein neues Spiel beginnen?',`<p>Dadurch wird der Spielstand dieser Fortsetzung in diesem Browser zurückgesetzt. Ihr könnt vorher euer Protokoll sichern.</p><div class="actions"><button data-action="export">Protokoll sichern ↓</button><button class="primary" data-action="reset-confirm">Neues Spiel beginnen</button><button data-action="cancel">Abbrechen</button></div>`);else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.area){state.area=b.dataset.area;save();render();$('room-area').scrollIntoView({behavior:'instant',block:'start'});}else if(b.dataset.item)item(b.dataset.item);else if(b.dataset.hint){const id=b.dataset.hint,t=EscapeCore.getTask(id);state.hints[id]=Math.min(t.hints.length,(state.hints[id]||0)+1);save();$('task-'+id).outerHTML=taskHTML(t);const p=$('task-'+id).querySelector('.hints');if(p){p.setAttribute('tabindex','-1');p.focus({preventScroll:true});}}else if(b.dataset.insert){const el=$('answer-'+b.dataset.target);if(!el)return;const start=el.selectionStart??el.value.length,end=el.selectionEnd??start;const selected=el.value.slice(start,end);const v=b.dataset.insert==='root'?`sqrt(${selected})`:b.dataset.insert==='abs'?`|${selected}|`:selected?`(${selected})/`:'()/()';el.setRangeText(v,start,end,'end');el.focus();if(!selected){const pos=start+(b.dataset.insert==='root'?5:1);el.setSelectionRange(pos,pos);}el.dispatchEvent(new Event('input',{bubbles:true}));}else if(b.dataset.action){switch(b.dataset.action){case'resume':go(state.rooms.includes('exit')?'end':'map');break;case'timer':pauseTimer();break;case'uv':case'uv-dialog':useUV();break;case'export':downloadReport();break;case'report':printDoc('report');break;case'print-teacher':printDoc('teacher');break;case'cancel':$('overlay').close();break;case'reset-confirm':state=EscapeCore.fresh();save();$('overlay').close();render();window.scrollTo(0,0);notify('Ein neues Spiel ist vorbereitet.');break;}}});
window.addEventListener('pagehide',save);setInterval(tick,1000);$('storage-warning').hidden=saveOK;render();
})();

</script></body></html>
